# Railway service config for the UW research MCP connector (claude.ai custom connector).
#
# Setup (one-time, via the Railway dashboard):
#   1. "+ New Service" → GitHub repo → this repo, main branch
#   2. Settings → Source: Root Directory = /
#   3. Settings → Build: Dockerfile Path = apps/earnings-mcp/Dockerfile
#   4. Settings → Variables:
#        UNUSUAL_WHALES_API_KEY   (share from the api service's variable)
#        MCP_PATH_TOKEN           long random string — the MCP endpoint becomes /mcp/<token>.
#                                 claude.ai custom connectors can't send custom auth headers
#                                 without OAuth, so the secret lives in the URL. Required for
#                                 any public deployment.
#   5. Settings → Networking: Generate Domain
#   6. claude.ai → Settings → Connectors → Add custom connector →
#        https://<generated-domain>/mcp/<MCP_PATH_TOKEN>

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/earnings-mcp/Dockerfile"

[deploy]
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
